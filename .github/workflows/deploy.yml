# Construye el sitio estático y lo publica en GitHub Pages.
#
# Requisito previo (una sola vez): Settings → Pages → Build and deployment →
# Source: "GitHub Actions". Mientras no se cambie, este workflow fallará en el
# paso de despliegue y Pages seguirá publicando la rama tal como está.
name: Deploy to GitHub Pages

on:
  push:
    branches: [prod]
  workflow_dispatch:

# Permisos mínimos por defecto; el job de despliegue eleva solo lo necesario.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run build
      - run: npm test

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
